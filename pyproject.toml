[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cinematic-agents"
version = "0.1.0"
description = "Production orchestration runtime for an 18-agent cinematic production system."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cinematic_agents"]
